---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: forge
description: Fedora KDE Atomic workstation for software development

base-image: ghcr.io/ublue-os/aurora-dx-nvidia-open
image-version: latest

modules:

  # ------------------------------------------------------------
  # System packages
  # ------------------------------------------------------------
  - type: dnf
    repos:
      nonfree: rpmfusion

      files:
        # Docker's official Fedora repository
        - https://download.docker.com/linux/fedora/docker-ce.repo

    install:
      packages:

        # ---- Development / CLI ----
        - 7zip
        - bat
        - btop
        - cmake
        - direnv
        - fd-find
        - fish
        - fuse-libs
        - fzf
        - gcc
        - git
        - git-delta
        - git-extras
        - git-lfs
        - glab
        - grsync
        - htop
        - httpie
        - jq
        - lm_sensors
        - lsd
        - lshw
        - lsof
        - mtr
        - ncdu
        - nethogs
        - nmap-ncat
        - openssl-devel
        - parallel
        - pipx
        - pv
        - ripgrep
        - rlwrap
        - screen
        - smartmontools
        - socat
        - strace
        - sysstat
        - tcpdump
        - tmux
        - tree
        - unar
        - unrar
        - whois
        - xclip
        - xxd
        - yq
        - zoxide
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting

        # ---- Build / development ----
        - java-25-openjdk-devel

        # ---- KDE applications ----
        - ark
        - filelight
        - gimp
        - kaccounts-integration
        - kaccounts-providers
        - kamoso
        - kate
        - kdiff3
        - kleopatra
        - kompare
        - meld
        - yakuake

        # ---- Docker ----
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin

        # ---- Multimedia ----
        - ffmpeg
        - gstreamer1-plugins-base
        - gstreamer1-plugins-good
        - gstreamer1-plugins-good-extras
        - gstreamer1-plugins-bad-free
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-plugin-libav
        - gstreamer1-vaapi
        - intel-media-driver
        - libva-intel-driver
        - libva-utils
        - phonon-qt5-backend-gstreamer

    remove:
      packages:
        # Keep Firefox as Flatpak rather than Fedora RPM.
        - firefox
        - firefox-langpacks

        # KDE applications you don't use.
        - dragon
        - elisa-player
        - juk
        - kaddressbook
        - kmahjongg
        - kmail
        - kmail-header-theme-editor
        - kmines
        - kmouth
        - kontact
        - konversation
        - korganizer
        - kpat
        - krdc
        - krfb
        - ktnef
        - ktorrent
        - marble

  # ------------------------------------------------------------
  # Fonts
  # ------------------------------------------------------------
  - type: dnf
    install:
      packages:
        - google-noto-sans-fonts
        - google-noto-cjk-fonts
        - google-noto-emoji-color-fonts
        - google-roboto-fonts
        - rsms-inter-fonts
        - rsms-inter-vf-fonts
        - jetbrains-mono-fonts-all
        - ibm-plex-fonts-all

  # ------------------------------------------------------------
  # Docker service
  # ------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - docker.service

  # ------------------------------------------------------------
  # Flatpaks
  # ------------------------------------------------------------
  - type: default-flatpaks
    configurations:

      - scope: system
        repo:
          title: Flathub (system)

        install:
          - org.mozilla.firefox
          - org.onlyoffice.desktopeditors
          - com.bitwarden.desktop
          - com.github.tchx84.Flatseal
          - com.usebruno.Bruno

      - scope: user
        repo:
          title: Flathub (user)

  # ------------------------------------------------------------
  # NVIDIA
  # ------------------------------------------------------------
  # We should verify the correct Aurora NVIDIA base/akmods
  # configuration before enabling this.
  #
  # Do NOT carry the old nvidia.sh script into the image.
  #
  # ------------------------------------------------------------

  # ------------------------------------------------------------
  # Image signing
  # ------------------------------------------------------------
  - type: signing
