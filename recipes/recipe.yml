---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: forge
description: Fedora KDE Atomic workstation for software development

base-image: ghcr.io/ublue-os/aurora-dx-nvidia-open
image-version: latest

modules:

  # ------------------------------------------------------------
  # System packages
  # ------------------------------------------------------------
  - type: dnf
    # No `nonfree` repo choice here on purpose: Aurora's base image already
    # ships full multimedia codecs (ffmpeg, x264, x265, etc.) preinstalled
    # via negativo17. Setting `nonfree: rpmfusion` disables negativo17's
    # repos, which orphans the already-installed packages' library
    # requirements (e.g. libx265.so.216) since rpmfusion's builds don't
    # provide the exact same sonames, breaking the build. Leave negativo17
    # as-is unless a package is needed that's only available via RPM Fusion.
    repos:
      files:
        # Docker's official Fedora repository
        - https://download.docker.com/linux/fedora/docker-ce.repo
        # 1Password's official repository (files/dnf/1password.repo)
        - 1password.repo
        # MEGA's official repository (files/dnf/megasync.repo). Pinned to
        # Fedora 44 — unverified whether MEGA has built for fc44 yet; bump
        # the version here if/when the Aurora base image moves to a newer
        # Fedora release, or if this fc44 path turns out not to exist.
        - megasync.repo

      keys:
        - https://downloads.1password.com/linux/keys/1password.asc
        - https://mega.nz/linux/repo/Fedora_44/repodata/repomd.xml.key

    install:
      # Aurora's base image ships some packages (e.g. gstreamer1-plugins-bad-free,
      # previously libavcodec/libx265) that negativo17's fuller builds need to
      # obsolete. A plain install transaction can't replace an already-installed
      # package's provider, so allow-erasing lets dnf erase and replace them in
      # the same transaction — equivalent to `dnf swap <old> <new> --allowerasing`.
      allow-erasing: true
      packages:

        # ---- Development / CLI ----
        - 7zip
        - bat
        - btop
        - cmake
        - direnv
        - fd-find
        - fish
        - fuse-libs
        - fzf
        - gcc
        - git
        - git-delta
        - git-extras
        - git-lfs
        - glab
        - grsync
        - htop
        - httpie
        - jq
        - lm_sensors
        - lsd
        - lshw
        - lsof
        - mtr
        - ncdu
        - nethogs
        - nmap-ncat
        - openssl-devel
        - parallel
        - pipx
        - pv
        - ripgrep
        - rlwrap
        - screen
        - smartmontools
        - socat
        - strace
        - sysstat
        - tcpdump
        - tmux
        - tree
        - unar
        - unrar
        - whois
        - xclip
        - xxd
        - yq
        - zoxide
        - zsh
        - zsh-autosuggestions
        - zsh-syntax-highlighting

        # ---- Build / development ----
        - java-25-openjdk-devel

        # ---- Password manager ----
        - 1password

        # ---- KDE applications ----
        - ark
        - filelight
        - gimp
        - kaccounts-integration
        - kaccounts-providers
        - kamoso
        - kate
        - kdiff3
        - kleopatra
        - kompare
        - meld
        - yakuake

        # ---- Docker ----
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin

        # ---- Multimedia ----
        - ffmpeg
        - vlc
        - gstreamer1-plugins-base
        - gstreamer1-plugins-good
        - gstreamer1-plugins-good-extras
        # gstreamer1-plugins-bad-freeworld (negativo17's full build) obsoletes
        # gstreamer1-plugins-bad-free (Fedora's patent-safe build), so only
        # the freeworld package is listed here.
        - gstreamer1-plugins-bad-freeworld
        - gstreamer1-plugins-ugly
        - gstreamer1-plugin-libav
        - gstreamer1-vaapi
        - libva-utils
        - phonon-qt5-backend-gstreamer

        # ---- Cloud storage ----
        # From MEGA's own repo (files/dnf/megasync.repo) — RPM Fusion nonfree
        # doesn't have a Fedora 44 build of megasync yet.
        - megasync

    remove:
      packages:
        # Keep Firefox as Flatpak rather than Fedora RPM.
        - firefox
        - firefox-langpacks

        # Game streaming host, not used.
        - sunshine

        # KDE applications you don't use.
        - dragon
        - elisa-player
        - juk
        - kaddressbook
        - kmahjongg
        - kmail
        - kmail-header-theme-editor
        - kmines
        - kmouth
        - kontact
        - konversation
        - korganizer
        - kpat
        - krdc
        - krfb
        - ktnef
        - ktorrent
        - marble

  # ------------------------------------------------------------
  # Fonts
  # ------------------------------------------------------------
  - type: dnf
    install:
      packages:
        - google-noto-sans-fonts
        - google-noto-cjk-fonts
        - google-noto-emoji-color-fonts
        - ibm-plex-fonts-all
        - rsms-inter-fonts
        - rsms-inter-vf-fonts

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono

      google-fonts:
        - Inter
        - Roboto
  # ------------------------------------------------------------
  # Docker service
  # ------------------------------------------------------------
  - type: systemd
    system:
      enabled:
        - docker.service

  # ------------------------------------------------------------
  # Flatpaks
  # ------------------------------------------------------------
  - type: default-flatpaks
    configurations:

      - scope: system
        repo:
          title: Flathub (system)

        install:
          - org.mozilla.firefox
          - org.onlyoffice.desktopeditors
          - com.bitwarden.desktop
          - com.slack.Slack
          - com.github.tchx84.Flatseal
          - com.usebruno.Bruno

      - scope: user
        repo:
          title: Flathub (user)

  # ------------------------------------------------------------
  # NVIDIA
  # ------------------------------------------------------------
  # We should verify the correct Aurora NVIDIA base/akmods
  # configuration before enabling this.
  #
  # Do NOT carry the old nvidia.sh script into the image.
  #
  # ------------------------------------------------------------

  # ------------------------------------------------------------
  # Image signing
  # ------------------------------------------------------------
  - type: signing
